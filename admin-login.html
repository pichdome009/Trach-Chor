<!DOCTYPE html>
<html lang="km">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ចូលគណនីគ្រប់គ្រង - Trach Chor</title>
  <!-- link bootstrap -->
  <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.css">
  <!-- link bootstrap-icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- custom css -->
  <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body>

  <div class="login-wrapper">
    <!-- Image Side (Hidden on Mobile) -->
    <div class="login-image-side">
      <div class="login-overlay">
        <h1 class="display-4 fw-bold mb-3">Trach <span style="color: var(--admin-secondary);">Chor</span></h1>
        <p class="fs-4 fw-light mb-0">ប្រព័ន្ធគ្រប់គ្រងទិន្នន័យ និងប្រតិបត្តិការទេសចរណ៍</p>
        <p class="mt-4 text-white-50">© 2026 ត្រាចជ័រ. រក្សាសិទ្ធិគ្រប់យ៉ាង.</p>
      </div>
    </div>

    <!-- Form Side -->
    <div class="login-form-side">
      <div class="login-form-content">
        <div class="text-center mb-5 d-lg-none">
          <h2 class="fw-bold mb-0">Trach <span style="color: var(--admin-secondary);">Chor</span></h2>
          <p class="text-muted small">ប្រព័ន្ធគ្រប់គ្រង (Admin Panel)</p>
        </div>

        <h3 class="fw-bold mb-1">សូមស្វាគមន៍ត្រឡប់មកវិញ</h3>
        <p class="text-muted mb-4">សូមបញ្ចូលព័ត៌មានគណនីដើម្បីចូលប្រព័ន្ធគ្រប់គ្រង</p>

        <form action="admin-dashboard.html">
          <!-- Username/Email -->
          <div class="mb-4">
            <label class="form-label fw-bold text-dark">អ៊ីមែល ឬឈ្មោះគណនី</label>
            <div class="position-relative">
              <i class="bi bi-person position-absolute top-50 translate-middle-y ms-3 text-muted"></i>
              <input type="text" class="form-control login-input ps-5" placeholder="បញ្ចូលអ៊ីមែលរបស់អ្នក..." required>
            </div>
          </div>

          <!-- Password -->
          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label fw-bold text-dark mb-0">ពាក្យសម្ងាត់</label>
              <a href="#" class="text-decoration-none small text-muted hover-primary">ភ្លេចពាក្យសម្ងាត់?</a>
            </div>
            <div class="position-relative">
              <i class="bi bi-lock position-absolute top-50 translate-middle-y ms-3 text-muted"></i>
              <input type="password" class="form-control login-input ps-5 pe-5" id="passwordInput" placeholder="••••••••" required>
              <button type="button" class="btn btn-link position-absolute top-50 end-0 translate-middle-y text-muted text-decoration-none" id="togglePassword">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me -->
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label text-muted" for="rememberMe">
              ចងចាំខ្ញុំនៅលើឧបករណ៍នេះ
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn login-btn w-100 mb-4">
            ចូលគណនី (Sign In)
          </button>
          
          <p class="text-center text-muted small mt-4">
            បញ្ហាចូលគណនី? <a href="#" class="text-decoration-none fw-bold" style="color: var(--admin-primary);">ទាក់ទងជំនួយការបច្ចេកទេស</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>
    // Toggle Password Visibility
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('passwordInput');

    togglePassword.addEventListener('click', function () {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.innerHTML = type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
    });
  </script>
</body>
</html>
