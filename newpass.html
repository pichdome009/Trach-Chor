<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Password</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="Trach-Chor/assets/vendor/bootstrap/css/bootstrap.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Battambang:wght@100;300;400;700;900&family=Bayon&family=Dancing+Script:wght@400..700&family=Great+Vibes&family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&family=Khmer&family=Noto+Sans+Khmer:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="Trach-Chor/assets/css/newpass.css" />
  </head>
  <body>
    <section class="p-5">
      <div class="container">
        <div class="row">
          <div class="col-6 m-auto p-5 rounded-4">
            <div class="card p-5 border-0 bg-transparent">
              <form
                action="verification.html"
                class="glass-bac shadow p-5 needs-validation"
                novalidate
              >
                <div class="text-center text-white">
                  <h1>ពាក្យសម្ងាត់ថ្មី</h1>
                  <p class="text-black">
                    សូមបញ្ចូលពាក្យសម្ងាត់ថ្មីរបស់អ្នកសម្រាប់គណនី Trach Chor VIP។
                    ពាក្យសម្ងាត់ថ្មីត្រូវតែខុសពីពាក្យសម្ងាត់ចាស់។
                  </p>
                </div>
                <div class="mb-3">
                  <label for="validationCustom01" class="form-label text-white"
                    >ពាក្យសម្ងាត់ <span class="text-danger">*</span></label
                  >
                  <input
                    type="password"
                    class="form-control line-input bg-transparent"
                    id="validationCustom01"
                    placeholder="បញ្ចូលពាក្យសម្ងាត់"
                    required
                  />
                  <div class="valid-feedback">Looks good!</div>
                  <div class="invalid-feedback">
                    សូមបញ្ចូលពាក្យសម្ងាត់របស់អ្នក
                  </div>
                </div>
                <div class="mb-5">
                  <label for="validationCustom01" class="form-label text-white"
                    >បញ្ជាក់ពាក្យសម្ងាត់
                    <span class="text-danger">*</span></label
                  >
                  <input
                    type="password"
                    class="form-control line-input bg-transparent"
                    id="validationCustom01"
                    placeholder="បញ្ចូលពាក្យសម្ងាត់"
                    required
                  />
                  <div class="valid-feedback">Looks good!</div>
                  <div class="invalid-feedback">
                    សូមបញ្ចូលពាក្យសម្ងាត់របស់អ្នក
                  </div>
                </div>
                <div class="mb-4">
                  <button type="submit" class="btn btn-success w-100 btn-color">
                    ចូលគណនាឥឡូវនេះ
                  </button>
                </div>
                <div class="text-center align-content-center">
                  <a href="login.html" class="">
                    <i class="bi bi-arrow-left"></i> ត្រឡប់ទៅទំព័រមុន</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="Trach-Chor/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
      (() => {
        "use strict";

        // Fetch all the forms we want to apply custom Bootstrap validation styles to
        const forms = document.querySelectorAll(".needs-validation");

        // Loop over them and prevent submission
        Array.from(forms).forEach((form) => {
          form.addEventListener(
            "submit",
            (event) => {
              if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
              }

              form.classList.add("was-validated");
            },
            false,
          );
        });
      })();
    </script>
  </body>
</html>
