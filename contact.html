<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="assets/css/chhenghorng.css">
    <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
</head>
<body>
    <section class="hero-banner py-5" >
    <div class="container">
        <div class="text-center mb-5 mt-4">
            <h6 class="text-uppercase fw-semibold contact-subtitle">Get In Touch</h6>
            <h1 class="fw-bold fs-1">Contact Us</h1>
            <p class="text-muted fs-4 mt-2">
             យើងរីករាយក្នុងការជួយអ្នករៀបចំដំណើរកម្សាន្តបន្ទាប់ សូមកុំស្ទាក់ស្ទើរក្នុងការទំនាក់ទំនងមកយើងខ្ញុំ
            </p>
        </div>
    </div>
</section>
    <section class="py-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-md-3">
                    <div class="card p-4 text-center border-3">
                        <i class="bi bi-telephone fs-1"></i>
                        <h5>Phone</h5>
                        <p>+855 12 345 678</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-4 text-center border-3">
                        <i class="bi bi-envelope fs-1"></i>
                        <h5>Email</h5>
                        <p>trachchor168@gmail.com</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-4 text-center border-3">
                        <i class="bi bi-geo-alt fs-1"></i>
                        <h5>Address</h5>
                        <p>Toul Kork, Phnom Penh,Cambodia</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-4 text-center border-3">
                        <i class="bi bi-clock fs-1"></i>
                        <h5>Working Hours</h5>
                        <p>Mon - Fri : 9:00 AM - 6:00 PM</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section class="py-5 bg-creamy">
        <div class="container">
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card shadow p-4">
                        <h2 class="mb-4 text-center"> Send us a Message</h2>
                        <form>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <input type="text" class="form-control" placeholder="Your Name">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <input type="email" class="form-control" placeholder="Your Email">
                                </div>
                            </div>
                            <input type="text" class="form-control mb-3" placeholder="Subject">
                            <textarea class="form-control mb-3" rows="6" placeholder="YourMessage"></textarea>
                            <button class="btn btn-info" type="submit">
                                Send Message
                            </button>
                        </form>
                    </div>
                </div>
            </div>
    </section>
    <section>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2324.138676311559!2d104.89007746235391!3d11.57193612222653!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3109519e706d9cdf%3A0xb0bf13884e6cd05f!2z4Z6Q4Z-S4Z6T4Z624Z6A4Z-L4Z6U4Z6O4Z-S4Z6K4Z674Z-H4Z6U4Z6O4Z-S4Z6K4Z624Z6b4Z6U4Z6F4Z-S4Z6F4Z-B4Z6A4Z6c4Z634Z6R4Z-S4Z6Z4Z624Z6i4Z624Z6T!5e0!3m2!1skm!2skh!4v1783661973111!5m2!1skm!2skh"
            width="100%" height="450" style="border:10px;"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>

    </section>
























    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

</body>

</html>
